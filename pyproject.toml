[project]
name = "advertest"
version = "0.0.0"
description = "Kiểm thử độ bền vững cho model perception của robot và xe tự hành"
requires-python = "==3.11.*"
dependencies = [
    "adversarial-robustness-toolbox==1.20.1",
    "ultralytics==8.4.163",
    "torchmetrics==1.9.0",
    "numpy==2.4.6",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
]

# torch và torchvision chọn theo máy: `uv sync --extra cpu` (dev, CI) hoặc `--extra cuda` (image Docker).
[project.optional-dependencies]
cpu = ["torch==2.14.0", "torchvision==0.29.0"]
cuda = ["torch==2.14.0", "torchvision==0.29.0"]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts/python/advertest_contracts", "ml_core", "attacks", "backend"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
