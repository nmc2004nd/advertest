[project]
name = "advertest"
version = "0.0.0"
description = "Kiểm thử độ bền vững cho model perception của robot và xe tự hành"
requires-python = "==3.11.*"
dependencies = [
    "adversarial-robustness-toolbox==1.20.1",
    "ultralytics==8.4.163",
    "torchmetrics==1.9.0",
    "numpy==2.4.6",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "boto3==1.43.103",
    "uvicorn==0.54.0",
    "pillow==12.3.0",
    "typer==0.27.2",
    "pycocotools==2.0.11",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    # Phase 6: bản vá nội bộ của imagecorruptions (attacks/corruptions/); cùng phiên bản đã khóa
    # qua ultralytics.
    "opencv-python==5.0.0.93",
    "scipy==1.17.1",
    # Phase 8: report chính thức (HTML Jinja2 → PDF WeasyPrint, biểu đồ matplotlib). Jinja2 và
    # matplotlib đã có gián tiếp (torch, ultralytics); ghi rõ để không mất khi các gói đó đổi.
    "weasyprint==70.0",
    "jinja2==3.1.6",
    "matplotlib==3.11.2",
]

[project.scripts]
advertest = "ml_core.cli:app"
advertest-worker = "advertest_worker.cli:app"
advertest-admin = "backend.admin_cli.cli:app"

# torch và torchvision chọn theo máy: `uv sync --extra cpu` (dev, CI) hoặc `--extra cuda` (image Docker).
[project.optional-dependencies]
cpu = ["torch==2.14.0", "torchvision==0.29.0"]
cuda = ["torch==2.14.0", "torchvision==0.29.0"]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    # Phase 8: đọc chữ trong PDF report ở test (chân trang mỗi trang).
    "pypdf==6.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "contracts/python/advertest_contracts",
    "ml_core",
    "attacks",
    "backend",
    "backend/worker/advertest_worker",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["specs", "docs", "scripts/log_*.py", "scripts/submit_log.py", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["advertest_contracts", "advertest_worker", "ml_core", "attacks", "backend"]

[tool.mypy]
python_version = "3.11"
mypy_path = "contracts/python:backend/worker"
explicit_package_bases = true
files = ["contracts/python", "ml_core", "attacks", "backend"]
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["advertest_contracts.*", "advertest_worker.*", "backend.*"]
strict = true

# boto3/botocore, ART, PyYAML và SciPy không kèm type stub; gói stub là dependency riêng, chưa được
# duyệt.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "art", "art.*", "yaml", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["contracts", "ml_core", "attacks", "backend", "tests"]
addopts = "--import-mode=importlib"
markers = ["db: cần Postgres thật (chạy bằng `make test-db`)"]
