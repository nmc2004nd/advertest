[project]
name = "advertest"
version = "0.0.0"
description = "Kiểm thử độ bền vững cho model perception của robot và xe tự hành"
requires-python = "==3.11.*"
dependencies = [
    "adversarial-robustness-toolbox==1.20.1",
    "ultralytics==8.4.163",
    "torchmetrics==1.9.0",
    "numpy==2.4.6",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "boto3==1.43.103",
    "uvicorn==0.54.0",
]

# torch và torchvision chọn theo máy: `uv sync --extra cpu` (dev, CI) hoặc `--extra cuda` (image Docker).
[project.optional-dependencies]
cpu = ["torch==2.14.0", "torchvision==0.29.0"]
cuda = ["torch==2.14.0", "torchvision==0.29.0"]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts/python/advertest_contracts", "ml_core", "attacks", "backend"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["specs", "docs", "scripts/log_*.py", "scripts/submit_log.py", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["advertest_contracts", "ml_core", "attacks", "backend"]

[tool.mypy]
python_version = "3.11"
mypy_path = "contracts/python"
explicit_package_bases = true
files = ["contracts/python", "ml_core", "attacks", "backend"]
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["advertest_contracts.*", "backend.*"]
strict = true

# boto3/botocore không kèm type stub; gói stub là dependency riêng, chưa được duyệt.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["contracts", "ml_core", "attacks", "backend", "tests"]
addopts = "--import-mode=importlib"
markers = ["db: cần Postgres thật (chạy bằng `make test-db`)"]
