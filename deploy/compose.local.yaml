# Bổ sung cho docker/compose.yaml khi chạy toàn bộ trên một máy bằng Docker (Windows, macOS, Linux).
# Dùng qua deploy/start.sh. Đường dẫn tương đối tính theo thư mục docker/ (file compose đầu tiên).
#
# Presigned URL ký cho http://127.0.0.1:9000 (MINIO_PUBLIC_ENDPOINT), host duy nhất mà cả trình
# duyệt (upload model, dataset) lẫn worker cùng gọi được: worker dùng chung network namespace của
# container minio (`network_mode: service:minio`), nên 127.0.0.1:9000 trong worker chính là MinIO,
# còn API vẫn gọi qua http://api:8000. Không cần host network, chạy được trên Docker Desktop.

services:
  worker-local:
    profiles: ["worker"]
    image: advertest-worker:local
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      args:
        TORCH: cpu
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    entrypoint: ["advertest-worker", "run"]
    network_mode: service:minio
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      CACHE_DIR: /app/cache
      DEVICE: ${WORKER_DEVICE:-cpu}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - worker_cache:/app/cache
    depends_on:
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # Worker công cụ (thử nhanh, kiểm tra model và attack spec): trong compose.yaml dùng host network
  # và gọi API qua 127.0.0.1. Ở đây dùng chung mạng của minio như worker-local. Token do start.sh
  # ghi vào .env.
  worker-tools:
    network_mode: service:minio
    environment:
      API_URL: http://api:8000
    depends_on:
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
