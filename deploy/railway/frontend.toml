# Config-as-code của service `frontend` trên Railway (/deploy/railway/frontend.toml).
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/frontend/Dockerfile"
watchPatterns = ["frontend/**", "docker/frontend/**"]

[deploy]
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
