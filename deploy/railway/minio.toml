# Config-as-code của service `minio` trên Railway (/deploy/railway/minio.toml). Cần volume ở /data.
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/minio/Dockerfile"
watchPatterns = ["docker/minio/**"]

[deploy]
healthcheckPath = "/minio/health/live"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
