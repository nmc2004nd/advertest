# Môi trường phát triển AdverTest: `make up` / `make down` (biến lấy từ file env, mặc định .env ở gốc repo).
# Postgres và MinIO không mở ra ngoài; các cổng được mở chỉ gắn vào 127.0.0.1.

name: advertest

x-minio-image: &minio-image cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần POSTGRES_PASSWORD}
      ADVERTEST_DB: advertest
      ADVERTEST_OWNER_PASSWORD: ${ADVERTEST_OWNER_PASSWORD:?Cần ADVERTEST_OWNER_PASSWORD}
      ADVERTEST_APP_PASSWORD: ${ADVERTEST_APP_PASSWORD:?Cần ADVERTEST_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tạo role advertest_owner, advertest_app và database khi khởi tạo lần đầu.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Chỉ healthy khi script init đã chạy xong và role của app kết nối được qua TCP.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$ADVERTEST_APP_PASSWORD\" psql -h 127.0.0.1 -U advertest_app -d advertest -tAc 'select 1'"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Cần MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Cần MINIO_SECRET_KEY}
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@127.0.0.1:9000
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    # Tạo 4 bucket rồi thoát; chạy lại không lỗi (--ignore-existing).
    image: cgr.dev/chainguard/minio-client@sha256:b2bd7824d23d3e3b15bedd7e87fbc3be29d2e213307b4f901e4a1d92356dc20f
    command: ["mb", "--ignore-existing", "local/artifacts", "local/reports", "local/datasets", "local/models"]
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      args:
        TORCH: cpu
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://advertest_owner:${ADVERTEST_OWNER_PASSWORD}@postgres:5432/advertest
      DATABASE_URL: postgresql+psycopg://advertest_app:${ADVERTEST_APP_PASSWORD}@postgres:5432/advertest
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # /health luôn trả 200; chỉ coi là healthy khi status = ok (Postgres và MinIO đều ok).
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'ok' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: ["sh", "-c", "corepack enable && corepack prepare pnpm@12.6.0 --activate && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_BASE_URL: /api
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
      API_PROXY_TARGET: http://api:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ../frontend:/app/frontend
      # Mock và type sinh từ contract (chế độ VITE_USE_MOCKS đọc contracts/mocks).
      - ../contracts:/app/contracts:ro
      # node_modules riêng của container, không dùng chung với máy chủ.
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
